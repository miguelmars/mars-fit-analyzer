openapi: 3.1.0
info:
  title: FIT Analyzer API — Mars Edition
  description: >
    El GPT consulta resultados ya procesados usando un session_id.
    El archivo ZIP/FIT se sube previamente con curl o el script de subida.
  version: 3.0.0
servers:
  - url: https://mars-fit-analyzer-production.up.railway.app
    description: Production
paths:
  /result/{session_id}:
    get:
      operationId: getResult
      summary: Obtener resultado de sesión de entrenamiento
      description: >
        Devuelve el análisis completo de una sesión previamente subida:
        resumen, laps, zonas Mars y métricas de FC/cadencia/velocidad.
        El session_id lo proporciona Mars después de subir el archivo.
      parameters:
        - name: session_id
          in: path
          required: true
          description: ID de sesión devuelto al subir el archivo (ej. d176b156)
          schema:
            type: string
      responses:
        "200":
          description: Resultado de la sesión
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      start_time:                  { type: string }
                      duration_hms:                { type: string }
                      distance_km:                 { type: number }
                      calories_kcal:               { type: integer }
                      ascent_m:                    { type: integer }
                      descent_m:                   { type: integer }
                      avg_hr_bpm:                  { type: integer }
                      max_hr_bpm:                  { type: integer }
                      avg_speed_kmh:               { type: number }
                      max_speed_kmh:               { type: number }
                      avg_cadence_rpm:             { type: integer }
                      training_effect_aerobic:     { type: number }
                      training_effect_anaerobic:   { type: number }
                      sport:                       { type: string }
                  laps:
                    type: array
                    items:
                      type: object
                      properties:
                        lap:              { type: integer }
                        duration_mmss:    { type: string }
                        distance_km:      { type: number }
                        avg_hr_bpm:       { type: integer }
                        max_hr_bpm:       { type: integer }
                        avg_speed_kmh:    { type: number }
                        calories_kcal:    { type: integer }
                  zones:
                    type: array
                    items:
                      type: object
                      properties:
                        zone:     { type: integer }
                        name:     { type: string }
                        bpm_low:  { type: integer }
                        bpm_high: { type: integer }
                        minutes:  { type: number }
                        percent:  { type: number }
                  record_summary:
                    type: object
                    properties:
                      records_count: { type: integer }
                      hr:
                        type: object
                        properties:
                          avg: { type: number }
                          max: { type: integer }
                          p90: { type: number }
        "404":
          description: session_id no encontrado o expirado
