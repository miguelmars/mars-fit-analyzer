openapi: 3.1.0
info:
  title: FIT Analyzer API — Mars Edition
  description: >
    Analiza archivos .fit o .zip de Garmin para Mars.
    Devuelve resumen de entrenamiento, laps, zonas oficiales Mars y métricas compactas.
  version: 2.0.0
servers:
  - url: https://TU-DOMINIO-RAILWAY.up.railway.app
    description: Production
paths:
  /:
    get:
      operationId: healthCheck
      summary: Verificar que la API está activa
      responses:
        "200":
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
  /analyze-fit:
    post:
      operationId: analyzeFit
      summary: Analizar archivo FIT o ZIP de Garmin
      description: >
        Sube un archivo .fit o .zip exportado desde Garmin.
        Devuelve sesión, laps, distribución de zonas oficiales Mars y métricas resumidas.
        Por defecto NO devuelve todos los registros segundo a segundo para evitar saturar el GPT.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo .fit o .zip de Garmin
                include_records:
                  type: boolean
                  default: false
                  description: Incluir todos los registros segundo a segundo. Usar sólo si se necesita depuración avanzada.
      responses:
        "200":
          description: Análisis exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  athlete:
                    type: string
                  zone_model:
                    type: string
                  session:
                    type: object
                    properties:
                      start_time: { type: string }
                      duration_seconds: { type: integer }
                      duration_hms: { type: string }
                      distance_km: { type: number }
                      calories_kcal: { type: integer }
                      ascent_m: { type: integer }
                      descent_m: { type: integer }
                      avg_hr_bpm: { type: integer }
                      max_hr_bpm: { type: integer }
                      avg_speed_kmh: { type: number }
                      max_speed_kmh: { type: number }
                      avg_cadence_rpm: { type: integer }
                      max_cadence_rpm: { type: integer }
                      avg_temperature_c: { type: integer }
                      max_temperature_c: { type: integer }
                      training_effect_aerobic: { type: number }
                      training_effect_anaerobic: { type: number }
                      sport: { type: string }
                      sub_sport: { type: string }
                  laps:
                    type: array
                    items:
                      type: object
                  zones:
                    type: array
                    items:
                      type: object
                      properties:
                        zone: { type: integer }
                        name: { type: string }
                        bpm_low: { type: integer }
                        bpm_high: { type: integer }
                        seconds: { type: integer }
                        minutes: { type: number }
                        percent: { type: number }
                  record_summary:
                    type: object
                  analysis_guidance:
                    type: object
        "400":
          description: Archivo inválido o sin .fit
